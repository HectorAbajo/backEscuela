<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de LEDs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    .conexion {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 30px;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .led-card {
      background: #16213e;
      border-radius: 16px;
      padding: 25px 30px;
      width: 200px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .led-card h3 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #a0c4ff;
    }

    .led-indicator {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #2a2a4a;
      margin: 0 auto 20px;
      border: 3px solid #333;
      transition: all 0.3s ease;
    }

    .led-indicator.on {
      background: #00e676;
      box-shadow: 0 0 20px #00e676, 0 0 40px #00e67655;
      border-color: #00c853;
    }

    .botones {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }

    .btn-on  { background: #00b300; color: white; }
    .btn-off { background: #cc2200; color: white; }
  </style>
</head>
<body>

  <h1>🔌 Control de LEDs</h1>
  <p class="conexion">Conectado via MQTT | Actualiza cada 2s</p>

  <div class="grid">
    <div class="led-card">
      <h3>LED 1</h3>
      <div class="led-indicator" id="ind1"></div>
      <div class="botones">
        <button class="btn-on"  onclick="control(1,'ON')">ON</button>
        <button class="btn-off" onclick="control(1,'OFF')">OFF</button>
      </div>
    </div>

    <div class="led-card">
      <h3>LED 2</h3>
      <div class="led-indicator" id="ind2"></div>
      <div class="botones">
        <button class="btn-on"  onclick="control(2,'ON')">ON</button>
        <button class="btn-off" onclick="control(2,'OFF')">OFF</button>
      </div>
    </div>

    <div class="led-card">
      <h3>LED 3</h3>
      <div class="led-indicator" id="ind3"></div>
      <div class="botones">
        <button class="btn-on"  onclick="control(3,'ON')">ON</button>
        <button class="btn-off" onclick="control(3,'OFF')">OFF</button>
      </div>
    </div>
  </div>

  <script>
    async function control(num, estado) {
      await fetch(`/led/${num}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado })
      });
      actualizarEstado();
    }

    async function actualizarEstado() {
      try {
        const res = await fetch('/estado');
        const data = await res.json();
        document.getElementById('ind1').className = 'led-indicator' + (data.led1 ? ' on' : '');
        document.getElementById('ind2').className = 'led-indicator' + (data.led2 ? ' on' : '');
        document.getElementById('ind3').className = 'led-indicator' + (data.led3 ? ' on' : '');
      } catch (e) {
        console.error('Error obteniendo estado:', e);
      }
    }

    setInterval(actualizarEstado, 2000);
    actualizarEstado();
  </script>

</body>
</html>
